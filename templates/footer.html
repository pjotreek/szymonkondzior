  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="cart-title">
    <div class="drawer-head">
      <h2 id="cart-title">Koszyk</h2>
      <button class="icon-btn" type="button" data-close-cart aria-label="Zamknij koszyk">
        <svg viewBox="0 0 8 8" width="16" height="16" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M0 0h2v1H0zM1 1h2v1H1zM2 2h4v1H2zM3 3h2v2H3zM2 5h4v1H2zM1 6h2v1H1zM0 7h2v1H0zM6 0h2v1H6zM5 1h2v1H5zM5 6h2v1H5zM6 7h2v1H6z"/></svg>

    <div class="shipping">
      <p data-shipping-label>Darmowa dostawa od 200 zł</p>
      <div class="shipping-bar"><div data-shipping-fill></div></div>
    </div>
    <ul class="cart-list" data-cart-list></ul>
    <div class="cart-empty" data-cart-empty>
      <p>Koszyk jest pusty.</p>
      <a class="btn btn--ghost" href="{{root}}#sklep" data-close-cart>Przejdź do sklepu</a>

    <div class="drawer-foot">
      <p class="subtotal"><span>Suma</span><b data-cart-total>0,00 zł</b></p>
      <button class="btn btn--block" type="button" disabled>Do kasy (wkrótce)</button>
