# Odświeża statystyki kanału i publikuje stronę na gh-pages (lustro domyślnego brancha).
name: Publikacja i staty

on:
  push:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Bez klucza API. Jeśli YouTube zmieni coś po swojej stronie, strona i tak się opublikuje.
      - name: Pobierz staty z YouTube
        continue-on-error: true
        run: python3 tools/fetch_stats.py

      - name: Zbuduj strony z data/products.json
        run: |
          pip install --quiet pillow
          python3 tools/build_pages.py

      - name: Zapisz zmiany
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Aktualizacja statystyk i stron"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Publikuj na gh-pages
        run: git push --force origin HEAD:gh-pages
